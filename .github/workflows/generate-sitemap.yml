name: Generate sitemap (build Jekyll & commit)

on:
  push:
    branches: [ main ] # 若你的 default branch 不是 main，請改成正確分支

permissions:
  contents: write

jobs:
  build_and_sitemap:
    if: github.actor != 'github-actions[bot]'   # 避免 actions 自己的 commit 再次觸發
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      # 新增或替換的 steps（貼到 jobs.build_and_sitemap.steps 內）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install dependencies
        run: |
          echo "Ruby: $(ruby -v)"
          echo "Gem: $(gem -v)"
          if [ -f Gemfile ]; then
            echo "Using Gemfile -> use bundler"
            gem install bundler
            bundle config set path vendor/bundle || true
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile -> install jekyll and jekyll-sitemap globally"
            gem install jekyll jekyll-sitemap
          fi

      - name: Build site (save logs & upload on failure)
        id: build
        run: |
          set -o pipefail
          mkdir -p build-logs
          echo "---- ENV ----"
          ruby -v
          gem list --local
          echo "---- Run jekyll build (trace) ----"
          if [ -f Gemfile ]; then
            bundle exec jekyll build --incremental=false --trace 2>&1 | tee build-logs/jekyll-build.log
          else
            jekyll build --incremental=false --trace 2>&1 | tee build-logs/jekyll-build.log
          fi
          echo "::set-output name=exitcode::$?"
        continue-on-error: true

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-build-logs
          path: build-logs/

      - name: Fail if build failed
        if: steps.build.outputs.exitcode != '0'
        run: |
          echo "Jekyll build failed — see build logs artifact 'jekyll-build-logs'"
          exit 1

      # 後續的 Copy sitemap / Commit steps 照常放在後面（但要確保只有在 build 成功時才執行）

      - name: Copy sitemap to repo root (if generated)
        run: |
          if [ -f _site/sitemap.xml ]; then
            cp _site/sitemap.xml sitemap.xml
            echo "Sitemap copied to sitemap.xml"
          else
            echo "No sitemap found in _site/, aborting copy"
          fi

      - name: Commit and push sitemap (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml || true
          # 如果沒有 staged 變更，結束 job
          if git diff --staged --quiet; then
            echo "No changes to sitemap.xml"
            exit 0
          fi
          git commit -m "chore: update sitemap.xml [skip ci]" || echo "commit failed"
          git push