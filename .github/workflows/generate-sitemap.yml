name: Generate sitemap (build Jekyll & commit)

on:
  push:
    branches: [ main ] # 若你的 default branch 不是 main，請改成正確分支

permissions:
  contents: write

jobs:
  build_and_sitemap:
    if: github.actor != 'github-actions[bot]'   # 避免 actions 自己的 commit 再次觸發
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install dependencies
        run: |
          echo "Ruby: $(ruby -v)"
          echo "Gem: $(gem -v)"
          if [ -f Gemfile ]; then
            echo "Gemfile found — using bundler"
            gem install bundler
            bundle config set path vendor/bundle || true
            # cache 建議（可選）：actions/cache on git side
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile — installing jekyll and sitemap gem globally"
            gem install jekyll jekyll-sitemap
          fi

      - name: Build site (with trace)
        run: |
          echo "---- Environment ----"
          ruby -v
          gem list --local
          echo "---- Run Jekyll build ----"
          if [ -f Gemfile ]; then
            # 用 bundler 執行並開啟 trace，方便抓完整錯誤
            bundle exec jekyll build --incremental=false --trace
          else
            jekyll build --incremental=false --trace
          fi
          echo "Build exit code: $?"

      - name: Copy sitemap to repo root (if generated)
        run: |
          if [ -f _site/sitemap.xml ]; then
            cp _site/sitemap.xml sitemap.xml
            echo "Sitemap copied to sitemap.xml"
          else
            echo "No sitemap found in _site/, aborting copy"
          fi

      - name: Commit and push sitemap (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml || true
          # 如果沒有 staged 變更，結束 job
          if git diff --staged --quiet; then
            echo "No changes to sitemap.xml"
            exit 0
          fi
          git commit -m "chore: update sitemap.xml [skip ci]" || echo "commit failed"
          git push