name: Generate sitemap (build Jekyll & commit)

on:
  push:
    branches: [ main ] # 若分支不是 main 請改為你的分支名稱（如 master）

permissions:
  contents: write   # 給予 Actions 寫入權限，否則 git push 會失敗

jobs:
  build_and_sitemap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true # 自動處理套件快取

      - name: Build site
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build
          else
            gem install jekyll jekyll-sitemap jekyll-seo-tag
            jekyll build
          fi

      - name: Copy sitemap to repo root
        run: |
          if [ -f _site/sitemap.xml ]; then
            cp _site/sitemap.xml sitemap.xml
            echo "成功複製 sitemap.xml 到根目錄！"
          else
            echo "找不到 _site/sitemap.xml"
            exit 1
          fi

      - name: Commit and push sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          
          # 如果 sitemap 內容沒有變化就跳過 commit，避免無效提交
          if git diff --staged --quiet; then
            echo "Sitemap 沒有變更，跳過提交。"
          else
            git commit -m "chore: update sitemap.xml [skip ci]"
            git push
          fi