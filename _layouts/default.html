<style>
  html {
    /* 確保 html 元素沒有意外的邊距或內邊距影響 body */
    margin: 0;
    padding: 0;
  }

  body {
    font-family: system-ui;
    margin: 0; /* body 填滿 html */
    padding: 2rem; /* 在 body 周圍留出內邊距 */

    /* 默認 (亮色模式) */
    background-color: #ffffff; /* 或者使用 Canvas 如果你確定它在亮色模式下是白色 */
    color: #000000;       /* 或者使用 CanvasText */
  }

  /* 暗黑模式 */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #0d1117; /* GitHub 暗黑模式常用的背景色，或者你喜歡的任何暗色 */
      color: #c9d1d9;       /* GitHub 暗黑模式常用的文字顏色 */
    }
  }

  .markdown-body {
    max-width: 1024px;
    margin: auto; /* 這會讓 markdown-body 在 body 的 padding 內部居中 */
    /* .markdown-body 自身的背景和顏色會由 github-markdown.css 控制 */
    /* 如果 github-markdown.css 沒有正確應用背景，這裡可以考慮也設置一下，但通常不需要 */
  }
</style>
