<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <!-- Google Fonts: 中文 + 等寬 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4046615879480582"
     crossorigin="anonymous"></script>

  <!-- GitHub markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">

  <style>
    /* ── Design tokens ── */
    :root {
      --bg:           #f9fafb;
      --bg-surface:   #ffffff;
      --bg-muted:     #f3f4f6;
      --text:         #111827;
      --text-muted:   #6b7280;
      --border:       #e5e7eb;
      --accent:       #2563eb;
      --accent-hover: #1d4ed8;
      --radius:       10px;
      --nav-h:        58px;
      --content-w:    1060px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md:    0 4px 16px rgba(0,0,0,.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0d1117;
        --bg-surface:   #161b22;
        --bg-muted:     #1c2128;
        --text:         #e6edf3;
        --text-muted:   #8b949e;
        --border:       #30363d;
        --accent:       #58a6ff;
        --accent-hover: #79c0ff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      /* 讓內容不被固定 navbar 遮住 */
      padding-top: var(--nav-h);
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 內文區域 ── */
    .page-wrapper {
      max-width: var(--content-w);
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    /* ── Markdown 覆寫 ── */
    .markdown-body {
      background: transparent !important;
      color: var(--text) !important;
      font-family: 'Noto Sans TC', system-ui, sans-serif !important;
      font-size: 1rem !important;
      line-height: 1.75 !important;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      border-bottom-color: var(--border) !important;
      color: var(--text) !important;
      font-family: 'Noto Sans TC', sans-serif !important;
      letter-spacing: -0.02em;
    }

    .markdown-body a {
      color: var(--accent) !important;
      text-underline-offset: 3px;
    }
    .markdown-body a:hover {
      color: var(--accent-hover) !important;
    }

    .markdown-body code,
    .markdown-body pre {
      font-family: 'JetBrains Mono', 'Cascadia Code', monospace !important;
      font-size: 0.875em !important;
    }

    .markdown-body pre {
      background: var(--bg-muted) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
    }

    .markdown-body blockquote {
      border-left-color: var(--accent) !important;
      color: var(--text-muted) !important;
      background: var(--bg-muted);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.75rem 1rem !important;
    }

    .markdown-body table {
      display: table;
      width: 100%;
    }

    .markdown-body table th {
      background: var(--bg-muted) !important;
    }

    .markdown-body table tr:nth-child(even) {
      background: var(--bg-muted) !important;
    }

    .markdown-body img {
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    /* ── Podcast 格線（原有功能保留）── */
    .podcast-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .podcast-cell {
      padding: 1.25rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    audio {
      width: 100%;
      height: 40px;
      margin: 0.5rem 0;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      width: 100%; height: 100%;
      left: 0; top: 0;
    }

    @media (max-width: 768px) {
      .podcast-grid { grid-template-columns: 1fr; }
      .page-wrapper { padding: 1.25rem 1rem 4rem; }
    }

    /* ── AI 聊天按鈕（精緻化）── */
    #ai-chat-btn-dl {
      position: fixed;
      bottom: 28px; right: 28px;
      width: 54px; height: 54px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      z-index: 9999;
      font-size: 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #ai-chat-btn-dl:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
    }

    #ai-chat-window-dl {
      display: none;
      position: fixed;
      bottom: 96px; right: 28px;
      width: 420px; height: 650px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 120px);
      background: var(--bg-surface);
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      z-index: 9998;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--accent);
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .chat-close {
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .chat-close:hover { opacity: 1; }

    @media (max-width: 480px) {
      #ai-chat-btn-dl { bottom: 18px; right: 14px; width: 48px; height: 48px; font-size: 20px; }
      #ai-chat-window-dl { bottom: 76px; right: 14px; width: calc(100vw - 28px); max-height: calc(100vh - 100px); }
    }
  </style>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHE1PH854B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DHE1PH854B');
  </script>

  <!-- AMP auto-ads -->
  <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
  </script>

  <meta charset="utf-8">
  {%- seo -%}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {%- if page.hreflang -%}
    <link rel="alternate" hreflang="{{ page.hreflang }}" href="{{ page.url | absolute_url }}">
  {%- endif -%}
  {%- include jsonld-switch.html -%}

</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-4046615879480582">
  </amp-auto-ads>

  <div class="page-wrapper">
    <article class="markdown-body">
      {{ content }}
    </article>
  </div>

  <!-- AI Chat -->
  <div id="ai-chat-btn-dl" onclick="toggleChatDL()">🤖</div>

  <div id="ai-chat-window-dl">
    <div class="chat-header">
      <span>Deep Learning 101 小助手</span>
      <span class="chat-close" onclick="toggleChatDL()">✕</span>
    </div>
    <iframe
      src="https://deeplearning101-deeplearning101.hf.space"
      style="width:100%;height:calc(100% - 40px);border:none;display:block;">
    </iframe>
  </div>

  <script>
    function toggleChatDL() {
      var w = document.getElementById("ai-chat-window-dl");
      var b = document.getElementById("ai-chat-btn-dl");
      var open = w.style.display === "block";
      w.style.display = open ? "none" : "block";
      b.innerHTML = open ? "🤖" : "✕";
      b.style.transform = open ? "scale(1)" : "scale(0.9)";
    }
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"fc0f4e2f76d3450bbcf5ca8c7c562e9b","r":1}' crossorigin="anonymous"></script>
</body>
</html>
