<style>
  body {
    padding: 2rem;
    font-family: system-ui;
    background-color: #fff; /* 預設白色 */
    color: #000;
  }

  .markdown-body {
    max-width: 960px;
    margin: auto;
  }

  /* 如果使用者使用的是黑暗模式 */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #000; /* 全黑 */
      color: #fff;            /* 文字白 */
    }

    a {
      color: #9ecbff;         /* 調整連結顏色以避免太亮 */
    }

    code {
      background-color: #222; /* 讓 code block 看得清楚 */
    }
  }
</style>
