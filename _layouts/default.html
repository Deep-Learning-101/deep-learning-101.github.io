<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4046615879480582"
     crossorigin="anonymous"></script>

  <!-- GitHub markdown-style CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">

<style>
  html, body {
    /* 你的原始 color 設置，既然之前 .markdown-body 內部文字正確，先保留它 */
    color: CanvasText;
    font-family: system-ui;
    padding: 2rem;
    margin: 0;

    /* 替換 background-color: Canvas; */
    /* 設置默認亮色背景 */
    background-color: #ffffff; /* 或者一個你喜歡的亮色 */
  }

  /* 暗黑模式 */
  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #0d1117; /* GitHub 暗黑模式常用的背景色，或者你喜歡的任何暗色 */
      /* color: CanvasText; 會在這裡繼續生效，理論上暗黑模式下 CanvasText 是亮色 */
    }
  }

  .markdown-body {
    max-width: 1024px;
    margin: auto;
    /* github-markdown.css 負責這裡的背景和文字顏色，
       它應該能正確處理亮暗主題切換。*/
  }

.podcast-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  max-width: 1500px;
  margin: 3rem auto;
  text-align: center;
}

.podcast-cell {
  padding: 1rem;
}

audio {
  width: 400px;
  height: 40px;
  margin: 0.5rem 0;
}

.video-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
}

.video-container iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
}

/* 響應式設計：手機時變成單欄 */
@media (max-width: 768px) {
  .podcast-grid {
    grid-template-columns: 1fr;
  }
}
</style>
  
  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHE1PH854B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DHE1PH854B');

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4046615879480582"
     crossorigin="anonymous"></script>
  <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {%- if page.hreflang -%}
    <link rel="alternate" hreflang="{{ page.hreflang }}" href="{{ page.url | absolute_url }}">
  {%- endif -%}
  {%- include jsonld-switch.html -%}

</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-4046615879480582">
</amp-auto-ads>
  <article class="markdown-body">
    {{ content }}
  </article>

<style>
    /* 桌機版預設尺寸 */
    #ai-chat-btn-dl {
        position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
        background-color: #2196F3; color: white; border-radius: 50%; 
        display: flex; justify-content: center; align-items: center; cursor: pointer; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 9999; font-size: 28px; 
        transition: transform 0.2s;
    }
    #ai-chat-window-dl {
        display: none; position: fixed; bottom: 100px; right: 30px; 
        width: 420px; height: 650px; 
        /* 🚀 最大寬度與高度動態計算 */
        max-width: calc(100vw - 40px); 
        max-height: calc(100vh - 120px); 
        background-color: white; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); 
        z-index: 9998; overflow: hidden; border: 1px solid #ddd;
    }
    
    /* 🚀 手機版專屬微調 */
    @media (max-width: 480px) {
        #ai-chat-btn-dl { bottom: 20px; right: 15px; width: 50px; height: 50px; font-size: 24px; }
        #ai-chat-window-dl {
            bottom: 80px; right: 15px;
            width: calc(100vw - 30px);
            max-height: calc(100vh - 100px);
        }
    }
</style>

<div id="ai-chat-btn-dl" onclick="toggleChatDL()">🤖</div>

<div id="ai-chat-window-dl">
    <div style="background-color: #2196F3; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-weight: bold;">
        <span style="font-size: 15px;">Deep Learning 101 小助手</span>
        <span onclick="toggleChatDL()" style="cursor: pointer; font-size: 18px; padding: 0 5px;">✖</span>
    </div>
    <iframe
        src="https://deeplearning101-deeplearning101.hf.space"
        style="width: 100%; height: calc(100% - 40px); border: none; display: block; background-color: #ffffff;">
    </iframe>
</div>

<script>
    function toggleChatDL() {
        var chatWindow = document.getElementById("ai-chat-window-dl");
        var chatBtn = document.getElementById("ai-chat-btn-dl");

        if (chatWindow.style.display === "none") {
            chatWindow.style.display = "block";
            chatBtn.innerHTML = "✖";
            chatBtn.style.transform = "scale(0.9)";
        } else {
            chatWindow.style.display = "none";
            chatBtn.innerHTML = "🤖";
            chatBtn.style.transform = "scale(1)";
        }
    }
</script>

</body>
</html>
