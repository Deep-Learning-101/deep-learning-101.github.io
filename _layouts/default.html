<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>

  <!-- GitHub markdown-style CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">

<style>
  html, body {
    /* 你的原始 color 設置，既然之前 .markdown-body 內部文字正確，先保留它 */
    color: CanvasText;
    font-family: system-ui;
    padding: 2rem;
    margin: 0;

    /* 替換 background-color: Canvas; */
    /* 設置默認亮色背景 */
    background-color: #ffffff; /* 或者一個你喜歡的亮色 */
  }

  /* 暗黑模式 */
  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #0d1117; /* GitHub 暗黑模式常用的背景色，或者你喜歡的任何暗色 */
      /* color: CanvasText; 會在這裡繼續生效，理論上暗黑模式下 CanvasText 是亮色 */
    }
  }

  .markdown-body {
    max-width: 1024px;
    margin: auto;
    /* github-markdown.css 負責這裡的背景和文字顏色，
       它應該能正確處理亮暗主題切換。*/
  }
</style>
  
  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHE1PH854B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DHE1PH854B');
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4046615879480582"
     crossorigin="anonymous"></script>
  <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>
</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-4046615879480582">
</amp-auto-ads>
  <article class="markdown-body">
    {{ content }}
  </article>
</body>
</html>
